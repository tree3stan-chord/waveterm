[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveterm"
version = "0.5.0"
description = "A terminal-based music visualizer inspired by web audio visualizers"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "espadonne (mfw)", email = "espadonne@outlook.com"}
]
maintainers = [
    {name = "espadonne (mfw)", email = "espadonne@outlook.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Artistic Software",
]
keywords = ["music", "visualizer", "terminal", "ascii", "audio", "fft", "waveform"]
requires-python = ">=3.8"

dependencies = [
    "numpy>=1.21.0",
    "rich>=12.0.0",
    "textual>=0.41.0",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "toml>=0.10.0",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.4",
    "librosa>=0.9.2",
    "pydub>=0.25.1",
]
export = [
    "pillow>=9.0.0",
    "imageio>=2.19.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.991",
]
all = [
    "waveterm[audio,export,dev]"
]

[project.urls]
Homepage = "https://github.com/waveterm-team/waveterm"
Documentation = "https://waveterm.readthedocs.io"
Repository = "https://github.com/waveterm-team/waveterm"
"Bug Tracker" = "https://github.com/waveterm-team/waveterm/issues"

[project.scripts]
waveterm = "waveterm.cli:main"
waveterm-demo = "waveterm.cli:demo"
waveterm-tui = "waveterm.cli:tui"

[tool.setuptools.packages.find]
where = ["."]
include = ["waveterm*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=waveterm --cov-report=html --cov-report=term-missing"